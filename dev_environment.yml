name: telco-churn-dev
channels:
  - conda-forge
  - defaults
dependencies:
# --- CONDA MANAGED ---
  - python=3.10.19
  - pip
  # --- CORE DATA PROCESSING ---
  - numpy=2.2.5
  - pandas=2.3.3
  - scipy=1.15.3
  # --- MACHINE LEARNING ---
  - scikit-learn=1.7.2
  # --- VISUALIZATION ---
  - matplotlib=3.10.0
  - seaborn=0.13.2

# --- PIP MANAGED ---
  - pip:
      # --- MACHINE LEARNING & MODELING ---
      - imbalanced-learn==0.14.0
      - xgboost==3.1.2
      - optuna==4.6.0
      - joblib==1.5.2
      # --- EXPERIMENT TRACKING & UTILS ---
      - mlflow==3.6.0
      - loguru==0.7.3
      - python-dotenv==1.2.1
      # --- NOTEBOOK ECOSYSTEM ---
      - jupyterlab==4.4.10
      - ipykernel==7.1.0
      - ipywidgets==8.1.8
      # --- EDA & PROFILING ---
      - ydata-profiling==4.18.0
      - sweetviz==2.3.1     
      - umap-learn==0.5.9.post2
      # --- QUALITY TOOLS ---
      - pytest==9.0.1
      - ruff==0.14.5
      # --- PROJECT ---
      - -e .